name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The office runs natively on all three: the hooks, the installer and the
    # scripts are Node, so every OS runs the whole suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The Electron binary is not needed for type-checking or tests
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Type-check
        # src/config.ts imports office.config.json, which is gitignored
        shell: bash
        run: |
          cp office.config.example.json office.config.json
          npx tsc --noEmit -p .

      - name: Install Claude Code
        if: matrix.os == 'ubuntu-latest'
        # The npm package installs the same native binary as the standalone
        # installer. `claude plugin validate` only reads files, so no login
        # or network access is needed once it is installed.
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        if: matrix.os == 'ubuntu-latest'
        # The repository root is the agent-office plugin and its own
        # marketplace (.claude-plugin/). --strict fails on warnings too, so an
        # unknown field or a missing description stops here, not on install.
        run: claude plugin validate . --strict
        env:
          DISABLE_AUTOUPDATER: 1

      - name: Test
        # tests/plugin.test.ts runs `claude plugin validate` again from vitest
        # on ubuntu, where the CLI is installed (macOS and Windows skip it with a note)
        run: npm test

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: npx vite build

      - name: Check assets
        if: matrix.os == 'ubuntu-latest'
        # Every sprite and room the code can ask for exists in public/, and
        # public/ stays under its size budget (scripts/check-assets.mjs)
        run: npm run check-assets
